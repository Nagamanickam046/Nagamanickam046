<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
<style>
@keyframes pu{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.4) rotate(20deg)}}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes twk{0%,100%{opacity:1}50%{opacity:0.1}}
@keyframes csp{0%,100%{transform:scaleX(1)}25%{transform:scaleX(0.08)}75%{transform:scaleX(0.08)}}
.pu{animation:pu 1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bb{animation:bb 0.75s ease-in-out infinite}
.tw{animation:twk 1.1s ease-in-out infinite}
.tw2{animation:twk 1.1s 0.55s ease-in-out infinite}
.tw3{animation:twk 1.1s 0.28s ease-in-out infinite}
.sp{animation:csp 0.5s linear infinite;transform-box:fill-box;transform-origin:center}</style>
<rect width="900" height="64" fill="#0E3B8C"/>

<rect x="20" y="5" width="2" height="2" fill="white" class="tw"/><rect x="133" y="28" width="4" height="4" fill="white" class="tw2"/><rect x="246" y="7" width="2" height="2" fill="white" class="tw3"/><rect x="359" y="30" width="4" height="4" fill="white" class="tw"/><rect x="472" y="9" width="2" height="2" fill="white" class="tw2"/><rect x="585" y="32" width="4" height="4" fill="white" class="tw3"/><rect x="698" y="11" width="2" height="2" fill="white" class="tw"/><rect x="811" y="34" width="4" height="4" fill="white" class="tw2"/><rect x="74" y="13" width="2" height="2" fill="white" class="tw3"/><rect x="187" y="36" width="4" height="4" fill="white" class="tw"/><rect x="300" y="15" width="2" height="2" fill="white" class="tw2"/><rect x="413" y="38" width="4" height="4" fill="white" class="tw3"/><rect x="526" y="17" width="2" height="2" fill="white" class="tw"/><rect x="639" y="40" width="4" height="4" fill="white" class="tw2"/>
<defs>
  <pattern id="gp" x="0" y="0" width="40" height="14" patternUnits="userSpaceOnUse">
    <rect width="40" height="14" fill="#7A4419"/>
    <rect x="1" y="1" width="18" height="12" fill="#9a6030"/>
    <rect x="21" y="1" width="18" height="12" fill="#9a6030"/>
  </pattern>
  <clipPath id="gc"><rect x="0" y="50" width="960" height="16"/></clipPath>
</defs>
<rect x="0" y="50" width="960" height="14" fill="url(#gp)" clip-path="url(#gc)">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.45s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="50" width="960" height="3" fill="#43B047"/>
<g class="pu" transform="translate(10,14)"><g transform="translate(0,0)">
  <rect x="10" y="0" width="8" height="28" fill="#FBD000"/>
  <rect x="0" y="10" width="28" height="8" fill="#FBD000"/>
  <rect x="3" y="3" width="6" height="6" fill="#FBD000"/>
  <rect x="19" y="3" width="6" height="6" fill="#FBD000"/>
  <rect x="3" y="19" width="6" height="6" fill="#FBD000"/>
  <rect x="19" y="19" width="6" height="6" fill="#FBD000"/>
  <rect x="12" y="2" width="4" height="4" fill="white" opacity="0.6"/>
</g></g>
<g class="sp" transform="translate(862,20)"><g transform="translate(0,0)">
  <rect x="4" y="0" width="14" height="22" fill="#FBD000"/>
  <rect x="0" y="4" width="22" height="14" fill="#FBD000"/>
  <rect x="2" y="1" width="18" height="20" fill="#FBD000"/>
  <rect x="6" y="1" width="10" height="20" fill="#E5A300"/>
  <rect x="1" y="6" width="20" height="10" fill="#E5A300"/>
  <rect x="4" y="2" width="14" height="18" fill="#E5A300"/>
  <rect x="7" y="3" width="6" height="9" fill="#FFE566"/>
</g></g>
<text x="54" y="40" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="900" letter-spacing="2" fill="#00000066">HIGH SCORES</text>
<text x="52" y="38" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="900" letter-spacing="2" fill="white">HIGH SCORES</text>
</svg>