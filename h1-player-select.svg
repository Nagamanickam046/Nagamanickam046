<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
<style>
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes bb2{0%,100%{transform:translateY(0)}50%{transform:translateY(-12px)}}
@keyframes csp{0%,100%{transform:scaleX(1)}25%{transform:scaleX(0.08)}75%{transform:scaleX(0.08)}}
@keyframes cld{0%{transform:translateX(0)}100%{transform:translateX(-960px)}}
.b1{animation:bb 0.7s ease-in-out infinite}
.b2{animation:bb2 0.7s ease-in-out 0.25s infinite}
.sp{animation:csp 0.5s linear infinite;transform-box:fill-box;transform-origin:center}
.cl{animation:cld 18s linear infinite}
.cl2{animation:cld 18s linear 9s infinite}</style>
