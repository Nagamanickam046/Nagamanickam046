<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
<style>
@keyframes wave{0%,100%{transform:rotate(0deg)}25%{transform:rotate(-18deg)}75%{transform:rotate(18deg)}}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes pu{0%,100%{transform:scale(1)}50%{transform:scale(1.3)}}
@keyframes twk{0%,100%{opacity:0.8}50%{opacity:0.1}}
@keyframes cld{0%{transform:translateX(0)}100%{transform:translateX(-960px)}}
.wv{animation:wave 0.6s ease-in-out infinite;transform-origin:12px 22px}
.bb{animation:bb 0.8s ease-in-out infinite}
.pu{animation:pu 0.9s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.tw{animation:twk 1.3s ease-in-out infinite}
.tw2{animation:twk 1.3s 0.65s ease-in-out infinite}
.cl{animation:cld 25s linear infinite}</style>
<rect width="900" height="64" fill="#0D5C45"/>

<rect x="15" y="4" width="3" height="3" fill="#aaffaa" class="tw"/><rect x="146" y="31" width="3" height="3" fill="#aaffaa" class="tw2"/><rect x="277" y="12" width="3" height="3" fill="#aaffaa" class="tw"/><rect x="408" y="39" width="3" height="3" fill="#aaffaa" class="tw2"/><rect x="539" y="20" width="3" height="3" fill="#aaffaa" class="tw"/><rect x="670" y="47" width="3" height="3" fill="#aaffaa" class="tw2"/><rect x="801" y="28" width="3" height="3" fill="#aaffaa" class="tw"/><rect x="62" y="9" width="3" height="3" fill="#aaffaa" class="tw2"/><rect x="193" y="36" width="3" height="3" fill="#aaffaa" class="tw"/><rect x="324" y="17" width="3" height="3" fill="#aaffaa" class="tw2"/>
<defs>
  <pattern id="gp" x="0" y="0" width="40" height="14" patternUnits="userSpaceOnUse">
    <rect width="40" height="14" fill="#0a3d16"/>
    <rect x="1" y="1" width="18" height="12" fill="#9a6030"/>
    <rect x="21" y="1" width="18" height="12" fill="#9a6030"/>
  </pattern>
  <clipPath id="gc"><rect x="0" y="50" width="960" height="16"/></clipPath>
</defs>
<rect x="0" y="50" width="960" height="14" fill="url(#gp)" clip-path="url(#gc)">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.45s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="50" width="960" height="3" fill="#1a6b20"/>
<g transform="translate(10,12)">
  <g transform="translate(0,0)"><g transform="translate(0,0)">
  <rect x="7" y="0" width="14" height="4" fill="#E52521"/>
  <rect x="4" y="4" width="20" height="5" fill="#E52521"/>
  <rect x="3" y="8" width="23" height="11" fill="#FBD000"/>
  <rect x="5" y="10" width="5" height="5" fill="#2a1800"/>
  <rect x="17" y="10" width="5" height="5" fill="#2a1800"/>
  <rect x="3" y="17" width="23" height="4" fill="#7A3B00"/>
  <rect x="2" y="20" width="25" height="10" fill="#5C94FC"/>
  <rect x="3" y="22" width="9" height="5" fill="#E52521"/>
  <rect x="16" y="22" width="9" height="5" fill="#E52521"/>
  <rect x="1" y="30" width="10" height="6" fill="#E52521"/>
  <rect x="14" y="30" width="10" height="6" fill="#E52521"/>
  <rect x="1" y="34" width="10" height="5" fill="#5a3000"/>
  <rect x="14" y="34" width="10" height="5" fill="#5a3000"/>
</g></g>
  <g class="wv" transform="translate(26,0)">
    <rect x="0" y="0" width="8" height="4" fill="#5C94FC"/>
    <rect x="5" y="4" width="4" height="8" fill="#FBD000"/>
  </g>
</g>
<g class="bb" transform="translate(856,14)"><g transform="translate(0,0)">
  <rect x="6" y="17" width="16" height="11" fill="#f5d5b0"/>
  <rect x="8" y="14" width="12" height="5" fill="#f5d5b0"/>
  <rect x="0" y="6" width="28" height="12" fill="#E52521"/>
  <rect x="3" y="2" width="22" height="7" fill="#E52521"/>
  <rect x="7" y="0" width="14" height="5" fill="#E52521"/>
  <rect x="3" y="5" width="6" height="6" fill="white"/>
  <rect x="19" y="5" width="6" height="6" fill="white"/>
  <rect x="11" y="9" width="5" height="5" fill="white"/>
  <rect x="5" y="3" width="3" height="3" fill="#ff6666"/>
</g></g>
<text x="64" y="40" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="900" letter-spacing="2" fill="#00000066">CONNECT</text>
<text x="62" y="38" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="900" letter-spacing="2" fill="white">CONNECT</text>
</svg>