<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
<style>
@keyframes r1{0%,49%{opacity:1}50%,100%{opacity:0}}
@keyframes r2{0%,49%{opacity:0}50%,100%{opacity:1}}
@keyframes cld{0%{transform:translateX(0)}100%{transform:translateX(-960px)}}
@keyframes fw{0%,100%{transform:skewX(0deg)}50%{transform:skewX(-8deg)}}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.r1{animation:r1 0.28s steps(1) infinite}
.r2{animation:r2 0.28s steps(1) infinite}
.cl{animation:cld 22s linear infinite}
.fw{animation:fw 0.4s ease-in-out infinite;transform-origin:15px 0}
.bb{animation:bb 0.7s ease-in-out infinite}</style>
