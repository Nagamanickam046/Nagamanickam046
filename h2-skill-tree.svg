<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 64" width="100%" height="64">
<style>
@keyframes csp{0%,100%{transform:scaleX(1)}25%{transform:scaleX(0.08)}75%{transform:scaleX(0.08)}}
@keyframes pu{0%,100%{transform:scale(1) rotate(0deg)}50%{transform:scale(1.35) rotate(18deg)}}
@keyframes bb{0%,100%{transform:translateY(0)}50%{transform:translateY(-10px)}}
@keyframes twk{0%,100%{opacity:1}50%{opacity:0.15}}
.sp{animation:csp 0.5s linear infinite;transform-box:fill-box;transform-origin:center}
.sp2{animation:csp 0.5s 0.25s linear infinite;transform-box:fill-box;transform-origin:center}
.pu{animation:pu 1.1s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
.bb{animation:bb 0.8s ease-in-out infinite}
.tw{animation:twk 0.9s ease-in-out infinite}
.tw2{animation:twk 0.9s 0.45s ease-in-out infinite}</style>
<rect width="900" height="64" fill="#E8A000"/>

<rect x="10" y="5" width="4" height="4" fill="#c88a00" class="tw"/><rect x="147" y="24" width="4" height="4" fill="#c88a00" class="tw2"/><rect x="284" y="43" width="4" height="4" fill="#c88a00" class="tw"/><rect x="421" y="20" width="4" height="4" fill="#c88a00" class="tw2"/><rect x="558" y="39" width="4" height="4" fill="#c88a00" class="tw"/><rect x="695" y="16" width="4" height="4" fill="#c88a00" class="tw2"/><rect x="832" y="35" width="4" height="4" fill="#c88a00" class="tw"/><rect x="99" y="12" width="4" height="4" fill="#c88a00" class="tw2"/><rect x="236" y="31" width="4" height="4" fill="#c88a00" class="tw"/><rect x="373" y="8" width="4" height="4" fill="#c88a00" class="tw2"/><rect x="510" y="27" width="4" height="4" fill="#c88a00" class="tw"/><rect x="647" y="46" width="4" height="4" fill="#c88a00" class="tw2"/>
<defs>
  <pattern id="gp" x="0" y="0" width="40" height="14" patternUnits="userSpaceOnUse">
    <rect width="40" height="14" fill="#7A4419"/>
    <rect x="1" y="1" width="18" height="12" fill="#9a6030"/>
    <rect x="21" y="1" width="18" height="12" fill="#9a6030"/>
  </pattern>
  <clipPath id="gc"><rect x="0" y="50" width="960" height="16"/></clipPath>
</defs>
<rect x="0" y="50" width="960" height="14" fill="url(#gp)" clip-path="url(#gc)">
  <animateTransform attributeName="transform" type="translate" from="0 0" to="-40 0" dur="0.45s" repeatCount="indefinite"/>
</rect>
<rect x="0" y="50" width="960" height="3" fill="#2d7a30"/>
<g class="sp" transform="translate(10,18)"><g transform="translate(0,0)">
  <rect x="4" y="0" width="14" height="22" fill="#FBD000"/>
  <rect x="0" y="4" width="22" height="14" fill="#FBD000"/>
  <rect x="2" y="1" width="18" height="20" fill="#FBD000"/>
  <rect x="6" y="1" width="10" height="20" fill="#E5A300"/>
  <rect x="1" y="6" width="20" height="10" fill="#E5A300"/>
  <rect x="4" y="2" width="14" height="18" fill="#E5A300"/>
  <rect x="7" y="3" width="6" height="9" fill="#FFE566"/>
</g></g>
<g class="sp2" transform="translate(40,18)"><g transform="translate(0,0)">
  <rect x="4" y="0" width="14" height="22" fill="#FBD000"/>
  <rect x="0" y="4" width="22" height="14" fill="#FBD000"/>
  <rect x="2" y="1" width="18" height="20" fill="#FBD000"/>
  <rect x="6" y="1" width="10" height="20" fill="#E5A300"/>
  <rect x="1" y="6" width="20" height="10" fill="#E5A300"/>
  <rect x="4" y="2" width="14" height="18" fill="#E5A300"/>
  <rect x="7" y="3" width="6" height="9" fill="#FFE566"/>
</g></g>
<g class="pu" transform="translate(862,18)"><g transform="translate(0,0)">
  <rect x="10" y="0" width="8" height="28" fill="#E52521"/>
  <rect x="0" y="10" width="28" height="8" fill="#E52521"/>
  <rect x="3" y="3" width="6" height="6" fill="#E52521"/>
  <rect x="19" y="3" width="6" height="6" fill="#E52521"/>
  <rect x="3" y="19" width="6" height="6" fill="#E52521"/>
  <rect x="19" y="19" width="6" height="6" fill="#E52521"/>
  <rect x="12" y="2" width="4" height="4" fill="white" opacity="0.6"/>
</g></g>
<text x="80" y="40" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="900" letter-spacing="2" fill="#ffffff55">SKILL TREE</text>
<text x="78" y="38" font-family="'Courier New',Courier,monospace" font-size="18" font-weight="900" letter-spacing="2" fill="#2d1a00">SKILL TREE</text>
</svg>